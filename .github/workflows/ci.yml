name: Tag

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build Gradle
        run: ./gradlew build

      # Set up Node.js for Semantic Release
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"

      - name: Set up semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/exec semantic-release/git semantic-release/release-notes-generator conventional-changelog-conventionalcommits

      # Debug: verify GPG secrets are set (prints length only, not values)
      - name: Verify GPG secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "GPG_KEY_ID length: ${#GPG_KEY_ID}"
          echo "GPG_PRIVATE_KEY length: ${#GPG_PRIVATE_KEY}"
          echo "GPG_PASSPHRASE length: ${#GPG_PASSPHRASE}"
          echo "GPG_KEY_ID is set: $( [ -n "$GPG_KEY_ID" ] && echo YES || echo NO )"
          echo "GPG_PRIVATE_KEY is set: $( [ -n "$GPG_PRIVATE_KEY" ] && echo YES || echo NO )"
          echo "GPG_PASSPHRASE is set: $( [ -n "$GPG_PASSPHRASE" ] && echo YES || echo NO )"
          echo "GPG_PRIVATE_KEY contains BEGIN marker: $(echo "$GPG_PRIVATE_KEY" | grep -c 'BEGIN PGP')"
          echo "GPG_PRIVATE_KEY line count: $(echo "$GPG_PRIVATE_KEY" | wc -l)"

      # Run Semantic Release to create releases based on commit messages
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GIT_AUTHOR_NAME: asrr[bot]
          GIT_COMMITTER_EMAIL: dev@asrr.nl
          GIT_COMMITTER_NAME: asrr[bot]
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: npx semantic-release